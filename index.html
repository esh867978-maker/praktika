<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simple Weather App — поиск погоды по городам с OpenWeatherMap API">
  <title>Simple Weather App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <section class="top-banner">
    <div class="container">
      <h1 class="heading">Simple Weather App</h1>
      <p class="subtitle">Узнайте погоду в любом городе мира</p>
      <form aria-label="Поиск погоды по городу">
        <input type="text" placeholder="Search for a city" autofocus aria-label="Название города">
        <button type="submit">SUBMIT</button>
        <span class="msg" role="status" aria-live="polite"></span>
      </form>
    </div>
  </section>

  <section class="ajax-section">
    <div class="container">
      <ul class="cities" aria-label="Список городов с погодой"></ul>
    </div>
  </section>

  <script src="config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
